<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore o catálogo atacadista da Wei Import e selecione produtos para cotação.">
    <title>Catálogo de Produtos | Wei Import</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="imagens/1.png" type="image/x-icon">
</head>
<body class="store-page">
    <header class="top-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html" aria-label="Página inicial da Wei Import">
                        <img src="imagens/2.png" alt="Wei Import">
                    </a>
                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" placeholder="Busque por produto ou código" aria-label="Pesquisar produtos">
                </div>

                <div class="actions">
                    <a href="#" class="action btn-whatsapp-rotativo">
                        <i class="fa-regular fa-comments" aria-hidden="true"></i>
                        <div><strong>Atendimento</strong><span>Fale com a equipe</span></div>
                    </a>
                    <a href="cotacao.html" class="action quote-action">
                        <i class="fa-regular fa-clipboard" aria-hidden="true"></i>
                        <div><strong>Minha cotação</strong><span>0 de 10 produtos</span></div>
                    </a>
                    <a href="cotacao.html" class="action cart-action" aria-label="Abrir minha cotação">
                        <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <nav class="menu" aria-label="Categorias de produtos">
        <div class="container">
            <ul>
                <li class="menu-header">
                    <a href="catalogo.html"><i class="fa-solid fa-bars" aria-hidden="true"></i><span>Todas as categorias</span></a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="category-page">
        <div class="container">
            <header class="category-header">
                <span class="section-eyebrow">Catálogo atacadista</span>
                <h1>Todos os produtos</h1>
                <p>Selecione até 10 itens e envie sua cotação diretamente para nossa equipe comercial.</p>
            </header>

            <div id="vitrine-produtos" class="product-grid"></div>
        </div>
    </main>

    <script src="produtos.js"></script>
    <script src="script.js"></script>
</body>
</html>
